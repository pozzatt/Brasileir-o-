<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Elencos do Brasileirão</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --bg: #0b2e1f;
    --bg2: #0f3a28;
    --line: #2f5c44;
    --chalk: #f4f1e8;
    --chalk-dim: #c9d6cb;
    --yellow: #ffcc29;
    --blue: #4f8ff7;
    --red: #ff6b6b;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 40px, transparent 40px, transparent 80px),
      radial-gradient(circle at 50% -10%, #144a32 0%, var(--bg) 55%);
    color: var(--chalk);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height:100%;
    padding-bottom: 40px;
  }
  .field-lines{
    position:fixed; inset:0; pointer-events:none; opacity:.05; z-index:0;
    background-image:
      linear-gradient(var(--chalk) 1px, transparent 1px),
      linear-gradient(90deg, var(--chalk) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  header{
    position:relative; z-index:1;
    padding: 22px 18px 16px;
    text-align:center;
    border-bottom: 1px dashed var(--line);
  }
  header h1{
    font-family:'Anton', sans-serif;
    font-weight:400;
    letter-spacing: 0.5px;
    font-size: 28px;
    margin:0 0 2px;
    color: var(--chalk);
    text-transform: uppercase;
  }
  header h1 span{ color: var(--yellow); }
  header p{
    margin:0; font-size:12.5px; color: var(--chalk-dim); font-family:'IBM Plex Mono', monospace;
  }

  .tag{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:9.5px;
    color: var(--yellow); border:1px solid var(--line); border-radius:5px;
    padding: 2px 5px; margin-top:4px; letter-spacing:.3px; opacity:.85;
  }

  .search-wrap{
    position:relative; z-index:1; max-width:720px; margin: 10px auto 0; padding: 0 16px;
  }
  input[type="text"]{
    width:100%; padding: 11px 14px; border-radius: 10px; border:1px solid var(--line);
    background: rgba(0,0,0,0.2); color: var(--chalk); font-size:14px; font-family:'IBM Plex Sans', sans-serif;
    outline:none;
  }
  input[type="text"]::placeholder{ color: var(--chalk-dim); opacity:.6; }
  input[type="text"]:focus{ border-color: var(--yellow); }

  main{
    position:relative; z-index:1; max-width:720px; margin: 0 auto; padding: 16px;
  }

  .status{
    text-align:center; color: var(--chalk-dim); font-family:'IBM Plex Mono', monospace;
    font-size:13px; padding: 30px 10px; line-height:1.6;
  }
  .status.error{ color: var(--red); }

  .team-grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(96px,1fr)); gap:10px;
  }
  .team-card{
    background: rgba(255,255,255,0.03); border:1px solid var(--line); border-radius:12px;
    padding: 12px 8px 10px; text-align:center; cursor:pointer;
    transition: transform .12s ease, border-color .12s ease;
  }
  .team-card:active{ transform: scale(0.96); }
  .team-card:hover{ border-color: var(--yellow); }
  .team-card img{ width:44px; height:44px; object-fit:contain; margin-bottom:6px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.4)); }
  .team-card .badge-fallback{
    width:44px; height:44px; margin: 0 auto 6px; border-radius:50%;
    background: var(--line); display:flex; align-items:center; justify-content:center;
    font-family:'Anton', sans-serif; font-size:16px; color: var(--chalk);
  }
  .team-card .tname{ font-size:11.5px; font-weight:600; line-height:1.25; color: var(--chalk); }

  .back-btn{
    display:inline-flex; align-items:center; gap:6px; background:none; border:none; color: var(--yellow);
    font-family:'IBM Plex Mono', monospace; font-size:13px; cursor:pointer; padding:6px 0; margin-bottom:10px;
  }

  .team-header{
    display:flex; align-items:center; gap:14px; padding: 6px 0 18px;
    border-bottom: 1px dashed var(--line); margin-bottom: 16px;
  }
  .team-header img{ width:56px; height:56px; object-fit:contain; }
  .team-header h2{
    font-family:'Anton', sans-serif; font-weight:400; text-transform:uppercase;
    font-size:22px; margin:0; letter-spacing:.3px;
  }
  .team-header .meta{ font-size:12px; color: var(--chalk-dim); font-family:'IBM Plex Mono', monospace; margin-top:2px; }

  .pos-group{ margin-bottom: 22px; }
  .pos-title{
    font-family:'IBM Plex Mono', monospace; text-transform:uppercase; letter-spacing:1.5px;
    font-size:11.5px; color: var(--yellow); margin: 0 0 10px; padding-left:2px;
    display:flex; align-items:center; gap:8px;
  }
  .pos-title::after{ content:''; flex:1; height:1px; background: var(--line); }

  .player-row{
    display:flex; align-items:center; gap:12px; padding: 9px 4px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .player-num{
    width:30px; height:30px; border-radius:50%; background: rgba(255,255,255,0.04);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace; font-size:12px; color: var(--chalk-dim); flex-shrink:0;
  }
  .player-name{ font-size:14.5px; font-weight:500; color: var(--chalk); flex:1; }
  .player-nat{ font-size:11px; color: var(--chalk-dim); font-family:'IBM Plex Mono', monospace; }

  .refresh-note{
    text-align:center; font-size:11px; color: var(--chalk-dim); font-family:'IBM Plex Mono', monospace;
    padding: 24px 10px 4px; opacity:.6;
  }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius:4px; }
</style>
</head>
<body>
<div class="field-lines"></div>

<header>
  <h1>Elencos do Futebol <span>Brasileiro</span></h1>
  <p id="subtitle">carregando times de todas as divisões...</p>
</header>

<div class="search-wrap">
  <input type="text" id="searchInput" placeholder="Digite o nome do seu time...">
</div>

<main id="app">
  <div class="status">Carregando Série A, B, C e D...</div>
</main>

<p class="refresh-note">Busca em todas as divisões nacionais (A, B, C, D) · dados ao vivo via TheSportsDB · recarregue a página para atualizar</p>

<script>
const API = 'https://www.thesportsdb.com/api/v1/json/3';
const LEAGUES = [
  { name: 'Brazilian Serie A', tag: 'Série A' },
  { name: 'Brazilian Serie B', tag: 'Série B' },
  { name: 'Brazilian Serie C', tag: 'Série C' },
  { name: 'Brazilian Serie D', tag: 'Série D' },
];
const state = {
  allTeams: [],         // merged list across all divisions
  playersByTeam: {},    // teamId -> [players]
  view: 'list',          // 'list' | 'team'
};

const app = document.getElementById('app');
const subtitle = document.getElementById('subtitle');
const searchInput = document.getElementById('searchInput');

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function fetchJSON(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function loadAllTeams(){
  app.innerHTML = '<div class="status">Carregando times de todas as divisões...</div>';
  const results = await Promise.allSettled(
    LEAGUES.map(l => fetchJSON(API + '/search_all_teams.php?l=' + encodeURIComponent(l.name)).then(d => ({ league: l, data: d })))
  );

  let merged = [];
  let failedAny = false;
  results.forEach(r => {
    if(r.status === 'fulfilled'){
      const teams = (r.value.data.teams || []).filter(t => (t.strSport||'').toLowerCase() === 'soccer');
      teams.forEach(t => t._leagueTag = r.value.league.tag);
      merged = merged.concat(teams);
    } else {
      failedAny = true;
    }
  });

  // dedupe by idTeam (in case a team appears in more than one query)
  const seen = new Set();
  merged = merged.filter(t => {
    if(seen.has(t.idTeam)) return false;
    seen.add(t.idTeam);
    return true;
  });
  merged.sort((a,b) => a.strTeam.localeCompare(b.strTeam));

  state.allTeams = merged;

  if(merged.length === 0){
    app.innerHTML = '<div class="status error">Não consegui carregar os times agora (conexão ou API instável). Recarregue a página em instantes.</div>';
    return;
  }

  subtitle.textContent = merged.length + ' times · Série A, B, C e D' + (failedAny ? ' (uma divisão falhou ao carregar, puxe pra atualizar)' : '');
  renderTeamList();
}

function renderTeamList(){
  state.view = 'list';
  const q = searchInput.value.trim().toLowerCase();
  const filtered = q ? state.allTeams.filter(t => t.strTeam.toLowerCase().includes(q)) : state.allTeams;

  if(filtered.length === 0){
    app.innerHTML = '<div class="status">Nenhum time encontrado para "' + escapeHtml(q) + '". Confira a grafia ou tente um nome mais curto.</div>';
    return;
  }

  // if searching, show a flat result list; otherwise show full grid (can be long, that's fine, it's scrollable)
  app.innerHTML = '<div class="team-grid">' + filtered.map(t => `
    <div class="team-card" data-id="${t.idTeam}" data-name="${escapeHtml(t.strTeam)}" data-badge="${t.strTeamBadge || ''}">
      ${t.strTeamBadge
        ? `<img src="${t.strTeamBadge}/small" alt="${escapeHtml(t.strTeam)}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'badge-fallback',textContent:'${escapeHtml(t.strTeam.slice(0,3).toUpperCase())}'}))">`
        : `<div class="badge-fallback">${escapeHtml(t.strTeam.slice(0,3).toUpperCase())}</div>`
      }
      <div class="tname">${escapeHtml(t.strTeam)}</div>
      <div class="tag">${escapeHtml(t._leagueTag || '')}</div>
    </div>
  `).join('') + '</div>';

  document.querySelectorAll('.team-card').forEach(card => {
    card.addEventListener('click', () => openTeam(card.dataset.id, card.dataset.name, card.dataset.badge));
  });
}

const POSITION_ORDER = ['Goalkeeper','Goleiro','Defender','Zagueiro','Lateral','Meio','Midfielder','Meia','Volante','Forward','Atacante','Attacker'];
const POSITION_LABELS = {
  goalkeeper: 'Goleiros', goleiro: 'Goleiros',
  defender: 'Zagueiros', zagueiro: 'Zagueiros', 'centre-back':'Zagueiros', lateral:'Laterais',
  midfielder: 'Meio-campo', meia: 'Meio-campo', volante: 'Meio-campo', 'midfield':'Meio-campo',
  forward: 'Atacantes', atacante: 'Atacantes', attacker: 'Atacantes', striker: 'Atacantes', winger:'Atacantes',
};

function groupLabel(rawPos){
  if(!rawPos) return 'Outros';
  const key = rawPos.trim().toLowerCase();
  for(const k in POSITION_LABELS){
    if(key.includes(k)) return POSITION_LABELS[k];
  }
  return 'Outros';
}
const GROUP_ORDER = ['Goleiros','Zagueiros','Laterais','Meio-campo','Atacantes','Outros'];

async function openTeam(id, name, badge){
  state.view = 'team';
  app.innerHTML = '<button class="back-btn" onclick="renderTeamList()">← voltar aos times</button>' +
    `<div class="team-header">
      ${badge ? `<img src="${badge}/medium" alt="">` : ''}
      <div>
        <h2>${escapeHtml(name)}</h2>
        <div class="meta" id="teamMeta">carregando elenco...</div>
      </div>
    </div>
    <div class="status">Buscando jogadores...</div>`;

  if(state.playersByTeam[id]){
    renderPlayers(state.playersByTeam[id]);
    return;
  }
  try{
    const data = await fetchJSON(API + '/lookup_all_players.php?id=' + id);
    const players = (data.player || []) || [];
    state.playersByTeam[id] = players;
    renderPlayers(players);
  }catch(e){
    const body = document.querySelectorAll('.status');
    if(body.length) body[body.length-1].outerHTML = '<div class="status error">Não consegui carregar o elenco agora. Toque em voltar e tente de novo.<br><br>' + escapeHtml(e.message) + '</div>';
  }
}

function renderPlayers(players){
  const meta = document.getElementById('teamMeta');
  if(meta) meta.textContent = players.length + ' jogadores no elenco';

  const statusEls = document.querySelectorAll('.status');
  if(!players || players.length === 0){
    if(statusEls.length) statusEls[statusEls.length-1].outerHTML = '<div class="status">A API ainda não tem o elenco completo deste time cadastrado.</div>';
    return;
  }

  const groups = {};
  players.forEach(p => {
    const label = groupLabel(p.strPosition);
    if(!groups[label]) groups[label] = [];
    groups[label].push(p);
  });

  let html = '';
  GROUP_ORDER.forEach(label => {
    if(!groups[label]) return;
    const list = groups[label].sort((a,b) => (a.strPlayer||'').localeCompare(b.strPlayer||''));
    html += `<div class="pos-group">
      <div class="pos-title">${label} · ${list.length}</div>
      ${list.map(p => `
        <div class="player-row">
          <div class="player-num">${p.strNumber || '–'}</div>
          <div class="player-name">${escapeHtml(p.strPlayer)}</div>
          <div class="player-nat">${escapeHtml(p.strNationality || '')}</div>
        </div>
      `).join('')}
    </div>`;
  });

  if(statusEls.length) statusEls[statusEls.length-1].outerHTML = html;
}

let searchDebounce;
searchInput.addEventListener('input', () => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    if(state.view === 'list'){
      renderTeamList();
    }
  }, 150);
});

loadAllTeams();
</script>
</body>
</html>
