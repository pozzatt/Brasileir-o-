name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: |
          npm install
          npx expo install --fix

      - name: Gerar projeto iOS
        run: npx expo prebuild --platform ios --no-install

      - name: Instalar pods
        run: cd ios && pod install

      - name: Compilar (sem assinatura)
        shell: bash
        run: |
          cd ios
          xcodebuild \
            -workspace PozzattClub.xcworkspace \
            -scheme PozzattClub \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Empacotar .ipa
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/PozzattClub.app Payload/
          zip -qr PozzattClub.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PozzattClub-ipa
          path: PozzattClub.ipa
