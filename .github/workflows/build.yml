name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: |
          npm install
          npx expo install --fix

      - name: Gerar projeto iOS
        run: npx expo prebuild --platform ios --no-install

      - name: Instalar pods
        run: cd ios && pod install

      - name: Compilar (sem assinatura)
        shell: bash
        run: |
          cd ios
          set +e
          xcodebuild \
            -workspace PozzattClub.xcworkspace \
            -scheme PozzattClub \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > ../xcodebuild.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "error:|BUILD FAILED|build commands failed" ../xcodebuild.log | grep -v "warning:" | head -15 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          fi
          exit $code

      - name: Guardar log completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      - name: Empacotar ipa
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/PozzattClub.app Payload/
          zip -qr PozzattClub.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PozzattClub-ipa
          path: PozzattClub.ipa
